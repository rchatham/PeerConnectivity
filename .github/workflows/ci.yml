name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feature/**

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift Package Tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Run Swift package tests
        run: swift test

      - name: Run Network loopback tests
        env:
          PEERCONNECTIVITY_RUN_NETWORK_E2E: "1"
        run: |
          run_with_retry() {
            "$@" && return 0
            echo "Network loopback test command failed; retrying once..."
            sleep 5
            "$@"
          }

          run_with_retry swift test --filter NetworkPeerLoopbackTests

  xcode-test:
    name: Xcode Project Tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Run Xcode tests
        run: |
          xcodebuild test \
            -project PeerConnectivity.xcodeproj \
            -scheme PeerConnectivity \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -skip-testing:PeerConnectivityTests/NetworkPeerLoopbackTests

      - name: Run Network loopback tests
        env:
          PEERCONNECTIVITY_RUN_NETWORK_E2E: "1"
        run: |
          run_with_retry() {
            "$@" && return 0
            echo "Network loopback test command failed; retrying once..."
            sleep 5
            "$@"
          }

          run_with_retry xcodebuild test \
            -project PeerConnectivity.xcodeproj \
            -scheme PeerConnectivity \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -only-testing:PeerConnectivityTests/NetworkPeerLoopbackTests
